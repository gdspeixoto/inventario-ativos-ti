name: controle-ativos

services:
  postgres:
    image: postgres:16.10-alpine
    container_name: controle-ativos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_ativos}
      POSTGRES_USER: ${POSTGRES_USER:-controle_ativos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: America/Bahia
      PGTZ: America/Bahia
    ports:
      # Exposto apenas em loopback: o banco nao fica acessivel pela rede.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - log_statement=ddl
      - -c
      - log_min_duration_statement=500
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-controle_ativos_app} -d ${POSTGRES_DB:-controle_ativos}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - controle-ativos

  pgadmin:
    image: dpage/pgadmin4:9.9
    container_name: controle-ativos-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?defina PGADMIN_PASSWORD no arquivo .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - controle-ativos

volumes:
  postgres-data:
    name: controle-ativos-postgres-data
  pgadmin-data:
    name: controle-ativos-pgadmin-data

networks:
  controle-ativos:
    name: controle-ativos
    driver: bridge
