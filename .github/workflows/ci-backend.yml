name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: backend/ControleAtivos.slnx

jobs:
  lint-audit:
    name: Lint & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build (warnings = errors)
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore

      - name: Audit NuGet packages
        run: dotnet list ${{ env.SOLUTION_PATH }} package --vulnerable --include-transitive

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore

      - name: Run unit tests
        run: |
          dotnet test backend/tests/ControleAtivos.UnitTests \
            --no-build \
            --logger "trx;LogFileName=unit-tests.trx" \
            --collect:"XPlat Code Coverage"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-audit, unit-tests]
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: controle_ativos_tests
          POSTGRES_USER: controle_ativos_app
          POSTGRES_PASSWORD: test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONTROLE_ATIVOS_TEST_CONNECTION: "Host=localhost;Port=5432;Database=controle_ativos_tests;Username=controle_ativos_app;Password=test_password_ci"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore

      - name: Run integration tests
        run: |
          dotnet test backend/tests/ControleAtivos.IntegrationTests \
            --no-build \
            --logger "trx;LogFileName=integration-tests.trx" \
            --collect:"XPlat Code Coverage"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: |
          dotnet publish backend/src/ControleAtivos.Api/ControleAtivos.Api.csproj \
            -c Release \
            --no-restore \
            -o ${{ runner.temp }}/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ${{ runner.temp }}/publish
          retention-days: 7
